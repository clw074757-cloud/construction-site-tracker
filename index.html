<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>案場追蹤系統 v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#fff; --sf:#f8f8f8; --sf2:#f0f0f0; --bd:#e8e8e8; --bd2:#d0d0d0; --tx:#111; --tx2:#555; --tx3:#aaa; }
        * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { font-family:'Noto Sans TC',sans-serif; background:#f5f5f5; color:var(--tx); font-size:15px; min-height:100vh; }
        .hidden { display:none !important; }
        .mono { font-family:'DM Mono',monospace; }
        .inp { width:100%; height:48px; padding:0 14px; background:#f8f8f8; border:1.5px solid #e0e0e0; border-radius:10px; font-size:15px; color:#111; outline:none; transition:border-color 0.2s; }
        .inp:focus { border-color:#111; background:#fff; }
        .btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:13px 20px; border-radius:10px; font-weight:700; font-size:15px; border:none; cursor:pointer; transition:all 0.15s; }
        .btn:active { transform:scale(0.98); opacity:0.85; }
        .btn-p { background:#111; color:#fff; }
        .btn-s { background:#fff; color:#111; border:1.5px solid #d8d8d8; }
        .btn-d { background:#fee2e2; color:#dc2626; border:1.5px solid #fca5a5; }
        .btn-ok { background:#dcfce7; color:#166534; border:1.5px solid #bbf7d0; }
        .card { background:#fff; border:1.5px solid var(--bd); border-radius:16px; padding:18px; margin-bottom:12px; }
        .badge { display:inline-flex; align-items:center; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:700; }
        .bk { background:#111; color:#fff; }
        .bg { background:#f0f0f0; color:#555; }
        .by { background:#fef9c3; color:#854d0e; border:1px solid #fde68a; }
        .bgn { background:#dcfce7; color:#166534; }
        /* 修正照片預覽：顯示全部範圍縮圖 */
        .img-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
        .img-grid img { width:100%; aspect-ratio:1/1; object-fit:contain; background:#f0f0f0; border-radius:8px; border:1px solid #eee; cursor:pointer; }
        .spinner { border:3px solid #eee; border-top:3px solid #111; border-radius:50%; width:32px; height:32px; animation:spin 0.8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .nav-bar { background:rgba(255,255,255,0.95); backdrop-filter:blur(10px); border-top:1.5px solid #e8e8e8; position:fixed; bottom:0; width:100%; display:flex; z-index:50; }
        .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; padding:10px 0; color:#ccc; font-size:10px; font-weight:700; }
        .nav-btn.active { color:#111; }
    </style>
</head>
<body>

<div id="login-screen" class="fixed inset-0 z-[100] flex items-center justify-center p-5 bg-gray-100">
    <div class="bg-white w-full max-w-sm p-8 rounded-3xl shadow-lg">
        <h1 class="text-2xl font-black text-center mb-6">案場追蹤系統</h1>
        <div class="space-y-3">
            <input id="li" class="inp" placeholder="帳號">
            <input id="lp" type="password" class="inp" placeholder="密碼">
            <button onclick="doLogin()" class="btn btn-p">登入</button>
        </div>
        <p id="lmsg" class="text-center text-red-400 text-sm mt-3"></p>
    </div>
</div>

<div id="lov" class="fixed inset-0 bg-black/60 z-[200] hidden flex items-center justify-center flex-col gap-3">
    <div class="spinner"></div>
    <div id="ltxt" class="text-white font-bold">處理中...</div>
</div>

<div id="lightbox" class="fixed inset-0 z-[300] hidden flex items-center justify-center bg-black/95">
    <button onclick="closeLb()" class="absolute top-4 right-4 text-white text-3xl">×</button>
    <img id="lb-img" class="max-h-[90vh] max-w-[95vw] object-contain" src="">
</div>

<div id="modal" class="fixed inset-0 bg-black/40 z-[80] hidden flex items-end sm:items-center justify-center p-4">
    <div id="mbox" class="bg-white w-full max-w-md p-6 rounded-3xl max-h-[90vh] overflow-y-auto">
        <div id="mcontent"></div>
    </div>
</div>

<header class="sticky top-0 z-40 bg-white/95 border-b px-4 py-3 flex justify-between items-center">
    <div class="font-black">案場管理系統</div>
    <button onclick="logout()" class="text-xs text-gray-400">登出</button>
</header>

<main class="pb-24 p-4">
    <div id="page-projects" class="hidden">
        <div class="flex justify-between items-center mb-4">
            <h2 class="font-black">案場總覽</h2>
            <button onclick="openNewProject()" class="btn btn-p btn-sm w-auto py-2 px-4">+ 新增</button>
        </div>
        <div id="plist"></div>
    </div>

    <div id="page-detail" class="hidden">
        <button onclick="navTo('projects')" class="text-sm text-gray-400 font-bold mb-4">← 返回列表</button>
        <div id="dcontent"></div>
    </div>

    <div id="page-worker" class="hidden">
        <h2 class="font-black mb-4">我的任務回報</h2>
        <div id="wlist"></div>
    </div>

    <div id="page-client" class="hidden">
        <h2 class="font-black mb-4">我的案場進度</h2>
        <div id="clist"></div>
    </div>
</main>

<nav id="bnav" class="nav-bar"></nav>

<script>
// Supabase 設定保持原樣
const PU='https://jikwrufwagfjdfzhomle.supabase.co';
const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imppa3dydWZ3YWdmamRmemhvbWxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0Nzg5MzYsImV4cCI6MjA5MzA1NDkzNn0.bDXPFk0nB80JLKfZ9yWiCHLV6JhCC8lJhEpfPyjT0ag';
const H={'apikey':AK,'Authorization':`Bearer ${AK}`,'Content-Type':'application/json','Prefer':'return=representation'};
const api=t=>`${PU}/rest/v1/${t}`;
let CU=null;
let D={p:[],u:[],s:[],r:[],n:[],ins:[]};

async function loadAll(){
    const[p,u,s,r,n,ins]=await Promise.all([
        GET('projects','order=created_at.desc'),GET('users','order=name.asc'),
        GET('project_stages','order=sort_order.asc'),GET('progress_reports','order=timestamp.desc'),
        GET('site_notifications','order=notify_date.asc'),GET('inspections','order=inspected_at.desc')
    ]);
    D={p,u,s,r,n,ins};
}

const GET=async(t,q='')=>{try{const r=await fetch(`${api(t)}?${q}`,{headers:H});return await r.json();}catch{return [];}};
const POST=async(t,d)=>{try{const r=await fetch(api(t),{method:'POST',headers:H,body:JSON.stringify(d)});return await r.json();}catch{return null;}};
const PATCH=async(t,id,d)=>{try{await fetch(`${api(t)}?id=eq.${id}`,{method:'PATCH',headers:H,body:JSON.stringify(d)});return true;}catch{return false;}};
const DEL=async(t,id)=>{try{await fetch(`${api(t)}?id=eq.${id}`,{method:'DELETE',headers:H});return true;}catch{return false;}};

// 登入邏輯保持
async function doLogin(){
    const id=document.getElementById('li').value,pw=document.getElementById('lp').value;
    load(true,'驗證中...'); await loadAll();
    const u=D.u.find(x=>x.name===id&&x.password===pw);
    if(!u){ load(false); alert('帳號密碼錯誤'); return; }
    CU=u; localStorage.setItem('uid',u.id); login(); load(false);
}

function login(){
    document.getElementById('login-screen').classList.add('hidden');
    buildNav();
    navTo(CU.role==='worker'?'worker':CU.role==='client'?'client':'projects');
}

function buildNav(){
    const navs = CU.role==='worker' ? [{id:'worker',n:'任務'}] : CU.role==='client' ? [{id:'client',n:'我的案場'}] : [{id:'projects',n:'案場'},{id:'worker',n:'工班介面'}];
    document.getElementById('bnav').innerHTML = navs.map(v=>`<div onclick="navTo('${v.id}')" class="nav-btn" id="nb-${v.id}">${v.n}</div>`).join('');
}

function navTo(p){
    document.querySelectorAll('main > div').forEach(d=>d.classList.add('hidden'));
    document.getElementById('page-'+p).classList.remove('hidden');
    if(p==='projects') renderProjects();
    if(p==='worker') renderWorker();
    if(p==='client') renderClient();
}

// 案場顯示
function renderProjects(){
    const list = CU.role==='admin' ? D.p : D.p.filter(x=>x.manager_id===CU.id);
    document.getElementById('plist').innerHTML = list.map(p=>`
        <div class="card" onclick="openProject(${p.id})">
            <div class="flex justify-between">
                <div class="font-black">${p.name}</div>
                <div class="badge bk">${p.status}</div>
            </div>
            <div class="text-xs text-gray-400 mt-1">${p.address||'無地址'}</div>
        </div>
    `).join('');
}

async function openProject(id){
    await loadAll();
    const p = D.p.find(x=>x.id===id);
    const stages = D.s.filter(x=>x.project_id===id);
    const detail = document.getElementById('dcontent');
    navTo('detail');
    
    let html = `
        <div class="card bg-gray-50">
            <div class="flex justify-between items-start">
                <div><h2 class="text-xl font-black">${p.name}</h2><p class="text-xs text-gray-400">${p.status}</p></div>
                <button onclick="delProject(${p.id})" class="text-red-400 text-xs">刪除案場</button>
            </div>
            <div class="mt-4 flex gap-2 overflow-x-auto pb-2">
                ${['會勘','設計','報價階段','進行中','驗收','已完工','保固期'].map(s=>`<div class="badge ${p.status===s?'bk':'bg'}">${s}</div>`).join('')}
            </div>
        </div>
    `;

    // 1. 完成步驟直接顯示並可修改 (修改狀態功能)
    html += `
        <div class="card">
            <h3 class="font-bold mb-3">步驟設定</h3>
            <select onchange="updateProjectStatus(${p.id}, this.value)" class="inp">
                ${['會勘','設計','報價階段','進行中','驗收','已完工','保固期'].map(s=>`<option value="${s}" ${p.status===s?'selected':''}>${s}</option>`).join('')}
            </select>
        </div>
    `;

    // 2 & 3. 報價環節修正 (工班 -> 負責人 -> 業主)
    if(p.status === '報價階段'){
        html += `<div class="card">
            <h3 class="font-bold mb-2">💰 報價流程</h3>
            <div class="space-y-3">
                ${stages.map(s=>{
                    const w = D.u.find(u=>u.id===s.assigned_worker_id);
                    return `<div class="border-b pb-2">
                        <div class="flex justify-between font-bold text-sm">
                            <span>${s.name} (${w?.name||'未指派'})</span>
                            <span class="mono">$${s.quote_amount}</span>
                        </div>
                        <div class="flex gap-2 mt-2">
                            ${s.worker_confirmed_at ? `<span class="text-xs text-green-500">工班已呈報: ${s.worker_confirmed_at}</span>` : `<button onclick="confirmStage(${s.id}, 'worker')" class="btn btn-s text-xs py-1">工班確認報價</button>`}
                            ${s.manager_confirmed_at ? `<span class="text-xs text-blue-500">設計師已核准: ${s.manager_confirmed_at}</span>` : (s.worker_confirmed_at ? `<button onclick="confirmStage(${s.id}, 'manager')" class="btn btn-p text-xs py-1">核准報價</button>` : '')}
                            ${s.client_confirmed_at ? `<span class="text-xs text-green-600 font-bold">業主已簽認: ${s.client_confirmed_at}</span>` : (s.manager_confirmed_at ? `<button onclick="confirmStage(${s.id}, 'client')" class="btn btn-ok text-xs py-1">呈報業主按確認</button>` : '')}
                        </div>
                        <div class="flex gap-2 mt-2">
                            <button onclick="editStage(${s.id})" class="text-xs text-gray-400">編輯項目</button>
                            <button onclick="deleteStage(${s.id})" class="text-xs text-red-300">刪除</button>
                        </div>
                    </div>`;
                }).join('')}
                <button onclick="openStage(${p.id})" class="btn btn-s">+ 新增報價項目</button>
            </div>
        </div>`;
    }

    // 9. 驗收邏輯
    if(p.status === '進行中' || p.status === '驗收'){
        const reports = D.r.filter(x=>x.project_id===id);
        html += `<div class="card">
            <h3 class="font-bold mb-2">🔨 施工與驗收</h3>
            <div class="space-y-4">
                <div class="text-xs text-gray-400">每日施工回報 (需由設計師驗收後，再由業主驗收)</div>
                ${reports.slice(0,5).map(r=>`
                    <div class="bg-gray-50 p-2 rounded">
                        <div class="text-xs font-bold">${r.worker_name} - ${r.timestamp}</div>
                        <div class="text-sm">${r.notes}</div>
                        ${ig(r.image_urls)}
                    </div>
                `).join('')}
                <button onclick="openInsp(${p.id})" class="btn btn-p">發起正式驗收</button>
            </div>
        </div>`;
    }

    detail.innerHTML = html;
}

// 4. 案件刪除功能修復
async function delProject(id){
    if(!confirm('確定要徹底刪除此案件？所有關聯資料將消失。')) return;
    load(true, '刪除中...');
    await DEL('projects', id);
    await loadAll();
    load(false);
    navTo('projects');
}

// 7. 工種報價後項目可編輯與刪除
async function deleteStage(sid){
    if(!confirm('確定刪除此報價項目？')) return;
    await DEL('project_stages', sid);
    alert('已刪除');
    loadAll().then(()=>openProject(CU.current_pid)); // 重新整理
}

// 報價確認時間記錄
async function confirmStage(sid, role){
    const now = new Date().toLocaleString('zh-TW');
    let up = {};
    if(role==='worker') up = {worker_confirmed_at: now};
    if(role==='manager') up = {manager_confirmed_at: now};
    if(role==='client') up = {client_confirmed_at: now};
    
    await PATCH('project_stages', sid, up);
    // 5. 任一方上傳/確認後，設計師收到即時通知（模擬）
    alert(`確認成功！已記錄時間：${now}`);
    await loadAll();
    openProject(D.s.find(x=>x.id===sid).project_id);
}

// 8. 發通報邏輯修正
async function saveNotify(pid){
    const wid = parseInt(document.getElementById('n-w').value);
    const d = {
        project_id: pid,
        worker_id: wid,
        notify_date: document.getElementById('n-d').value,
        message: document.getElementById('n-m').value,
        created_at: new Date().toISOString()
    };
    await POST('site_notifications', d);
    alert('通報已發送！工班現在可在「任務」介面看到此通知。');
    closeM();
}

// 6. 圖片縮圖與放大預覽
function ig(urls){
    if(!urls) return '';
    let arr = [];
    try{ arr = Array.isArray(urls) ? urls : JSON.parse(urls); }catch{ arr = [urls]; }
    const safe = JSON.stringify(arr).replace(/"/g,'&quot;');
    return `<div class="img-grid">
        ${arr.map((u,i)=>`<img src="${u}" onclick="openLb('${safe}',${i})">`).join('')}
    </div>`;
}

function openLb(u,i=0){
    const arr = JSON.parse(u.replace(/&quot;/g,'"'));
    document.getElementById('lb-img').src = arr[i];
    document.getElementById('lightbox').classList.remove('hidden');
}
function closeLb(){ document.getElementById('lightbox').classList.add('hidden'); }

// 通用工具
function load(s,t){ 
    document.getElementById('lov').classList.toggle('hidden',!s);
    document.getElementById('ltxt').innerText=t;
}
function openM(h){ document.getElementById('mcontent').innerHTML=h; document.getElementById('modal').classList.remove('hidden'); }
function closeM(){ document.getElementById('modal').classList.add('hidden'); }
async function logout(){ localStorage.clear(); location.reload(); }
async function updateProjectStatus(pid, s){
    await PATCH('projects', pid, {status: s});
    alert('狀態已更新為：'+s);
    loadAll().then(()=>openProject(pid));
}

window.onload = () => {
    const uid = localStorage.getItem('uid');
    if(uid) { loadAll().then(()=>{
        CU = D.u.find(x=>x.id==uid);
        if(CU) login();
    }); }
};

</script>
</body>
</html>
