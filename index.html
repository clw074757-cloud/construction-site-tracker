<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>案場追蹤系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#fff; --sf:#f8f8f8; --sf2:#f0f0f0; --bd:#e8e8e8; --bd2:#d0d0d0; --tx:#111; --tx2:#555; --tx3:#aaa; }
        * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { font-family:'Noto Sans TC',sans-serif; background:#f5f5f5; color:var(--tx); font-size:15px; min-height:100vh; }
        .hidden { display:none !important; }
        .mono { font-family:'DM Mono',monospace; }
        .inp { width:100%; height:48px; padding:0 14px; background:#f8f8f8; border:1.5px solid #e0e0e0; border-radius:10px; font-size:15px; font-family:'Noto Sans TC',sans-serif; color:#111; outline:none; transition:border-color 0.2s; -webkit-appearance:none; }
        .inp:focus { border-color:#111; background:#fff; }
        .inp::placeholder { color:#bbb; }
        textarea.inp { height:auto; padding:12px 14px; resize:none; }
        select.inp { background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23111' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat:no-repeat; background-position:right 12px center; background-size:18px; padding-right:36px; background-color:#f8f8f8; }
        .label { display:block; font-size:11px; font-weight:700; color:#888; margin-bottom:5px; text-transform:uppercase; letter-spacing:0.06em; }
        .btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:13px 20px; border-radius:10px; font-weight:700; font-size:15px; font-family:'Noto Sans TC',sans-serif; border:none; cursor:pointer; transition:all 0.15s; }
        .btn:active { transform:scale(0.98); opacity:0.85; }
        .btn-p { background:#111; color:#fff; }
        .btn-s { background:#fff; color:#111; border:1.5px solid #d8d8d8; }
        .btn-d { background:#fee2e2; color:#dc2626; border:1.5px solid #fca5a5; }
        .btn-sm { padding:7px 14px; font-size:13px; width:auto; border-radius:8px; }
        .btn-ic { width:34px; height:34px; padding:0; border-radius:8px; flex-shrink:0; font-size:14px; }
        .card { background:#fff; border:1.5px solid var(--bd); border-radius:16px; padding:18px; margin-bottom:12px; }
        .csm { background:#fff; border:1.5px solid var(--bd); border-radius:12px; padding:14px; margin-bottom:8px; }
        .badge { display:inline-flex; align-items:center; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:700; white-space:nowrap; }
        .bk { background:#111; color:#fff; }
        .bg { background:#f0f0f0; color:#555; border:1px solid #e0e0e0; }
        .bgn { background:#dcfce7; color:#166534; border:1px solid #bbf7d0; }
        .by { background:#fef9c3; color:#854d0e; border:1px solid #fde68a; }
        .br { background:#fee2e2; color:#dc2626; border:1px solid #fca5a5; }
        .bb { background:#dbeafe; color:#1d4ed8; border:1px solid #bfdbfe; }
        .bpu { background:#f3e8ff; color:#7e22ce; border:1px solid #e9d5ff; }
        .prog-bar { height:5px; background:#eee; border-radius:99px; overflow:hidden; }
        .prog-fill { height:100%; background:#111; border-radius:99px; transition:width 0.4s; }
        .nav-bar { background:rgba(255,255,255,0.97); backdrop-filter:blur(12px); border-top:1.5px solid #e8e8e8; }
        .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; padding:9px 4px 11px; color:#ccc; font-size:10px; font-weight:700; font-family:'Noto Sans TC',sans-serif; background:none; border:none; cursor:pointer; gap:3px; transition:color 0.2s; }
        .nav-btn.active { color:#111; }
        .nav-btn svg { width:20px; height:20px; }
        .modal-bg { background:rgba(0,0,0,0.35); backdrop-filter:blur(4px); }
        .modal-box { background:#fff; border:1.5px solid #e0e0e0; border-radius:20px; max-height:88vh; overflow-y:auto; box-shadow:0 8px 40px rgba(0,0,0,0.12); }
        .img-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin-top:8px; }
        .img-grid img { width:100%; height:90px; object-fit:cover; border-radius:7px; border:1px solid #e8e8e8; cursor:pointer; }
        .flow-steps { display:flex; overflow-x:auto; gap:0; padding-bottom:4px; margin-bottom:16px; -ms-overflow-style:none; scrollbar-width:none; }
        .flow-steps::-webkit-scrollbar { display:none; }
        .flow-step { display:flex; flex-direction:column; align-items:center; flex-shrink:0; position:relative; min-width:52px; }
        .flow-step:not(:last-child)::after { content:''; position:absolute; top:13px; left:calc(50% + 14px); width:calc(100% - 28px); height:2px; background:#e0e0e0; z-index:0; }
        .flow-step.done:not(:last-child)::after { background:#111; }
        .sdot { width:26px; height:26px; border-radius:50%; border:2px solid #ddd; background:#fff; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:900; color:#ccc; z-index:1; position:relative; }
        .sdot.done { background:#111; border-color:#111; color:#fff; }
        .sdot.active { background:#fff; border-color:#111; color:#111; }
        .slabel { font-size:9px; font-weight:700; color:#aaa; margin-top:3px; text-align:center; width:52px; line-height:1.2; }
        .slabel.done,.slabel.active { color:#111; }
        .tl-item { position:relative; padding-left:26px; padding-bottom:18px; }
        .tl-item::before { content:''; position:absolute; left:8px; top:18px; bottom:0; width:2px; background:#e8e8e8; }
        .tl-item:last-child::before { display:none; }
        .tl-dot { position:absolute; left:0; top:3px; width:17px; height:17px; border-radius:50%; border:3px solid #f5f5f5; box-shadow:0 0 0 1.5px #ccc; }
        .spinner { border:3px solid #eee; border-top:3px solid #111; border-radius:50%; width:32px; height:32px; animation:spin 0.8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        #lightbox { background:rgba(0,0,0,0.93); }
        .fin-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #f0f0f0; }
        .fin-row:last-child { border-bottom:none; }
        .fin-total { display:flex; justify-content:space-between; align-items:center; padding:10px 0 4px; border-top:2px solid #111; margin-top:4px; }
        details > summary { list-style:none; cursor:pointer; }
        details > summary::-webkit-details-marker { display:none; }
        ::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-thumb { background:#ddd; border-radius:99px; }
    </style>
</head>
<body>

<div id="login-screen" class="fixed inset-0 z-[100] flex items-center justify-center p-5 bg-gray-100">
    <div class="bg-white w-full max-w-sm p-8 rounded-3xl shadow-lg border border-gray-200">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-black rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
            </div>
            <h1 class="text-2xl font-black text-black">案場追蹤系統</h1>
            <p class="text-sm text-gray-400 mt-1">工程進度管理平台</p>
        </div>
        <div class="space-y-3">
            <div><label class="label">帳號</label><input id="li" class="inp" placeholder="輸入帳號"></div>
            <div><label class="label">密碼</label><input id="lp" type="password" class="inp" placeholder="輸入密碼" onkeydown="if(event.key==='Enter')doLogin()"></div>
        </div>
        <button onclick="doLogin()" class="btn btn-p mt-5">登入</button>
        <p id="lmsg" class="text-center text-red-400 text-sm mt-3 min-h-[20px]"></p>
    </div>
</div>

<div id="lov" class="fixed inset-0 bg-black/60 z-[200] hidden flex items-center justify-center flex-col gap-3">
    <div class="spinner" style="border-top-color:#fff"></div>
    <div id="ltxt" class="text-white font-bold text-sm">處理中...</div>
</div>

<div id="lightbox" class="fixed inset-0 z-[300] hidden flex items-center justify-center">
    <button onclick="closeLb()" class="absolute top-4 right-4 text-white w-10 h-10 flex items-center justify-center bg-white/10 rounded-full text-2xl">×</button>
    <button id="lb-prev" onclick="changeLb(-1)" class="absolute left-2 text-white text-4xl w-12 h-20 flex items-center justify-center bg-white/10 rounded-xl hidden">‹</button>
    <button id="lb-next" onclick="changeLb(1)" class="absolute right-2 text-white text-4xl w-12 h-20 flex items-center justify-center bg-white/10 rounded-xl hidden">›</button>
    <button onclick="dlLb()" class="absolute bottom-5 right-5 text-white w-12 h-12 flex items-center justify-center bg-white/10 rounded-full text-xl border border-white/20">⬇</button>
    <img id="lb-img" class="max-h-[90vh] max-w-[92vw] object-contain select-none rounded-lg" src="">
</div>

<div id="modal" class="fixed inset-0 modal-bg z-[80] hidden flex items-end sm:items-center justify-center p-4">
    <div id="mbox" class="modal-box w-full max-w-md p-6"><div id="mcontent"></div></div>
</div>

<header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-gray-200 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-black rounded-lg flex items-center justify-center flex-shrink-0">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
        </div>
        <div>
            <div class="font-black text-sm text-black leading-tight">案場追蹤系統</div>
            <div id="urd" class="text-xs text-gray-400">未登入</div>
        </div>
    </div>
    <button onclick="logout()" class="text-xs font-bold text-gray-500 bg-gray-100 px-3 py-1.5 rounded-lg border border-gray-200">登出</button>
</header>

<main class="pb-28">
    <div id="page-projects" class="hidden p-4">
        <div class="flex justify-between items-center mb-3">
            <h2 class="text-base font-black">案場總覽</h2>
            <button id="btn-np" onclick="openNewProject()" class="btn btn-p btn-sm hidden">＋ 新增</button>
        </div>
        <div class="flex gap-2 overflow-x-auto pb-2 mb-3" style="-ms-overflow-style:none;scrollbar-width:none;">
            <button onclick="setF('all')" id="f-all" class="badge bk flex-shrink-0 cursor-pointer py-1.5 px-3">全部</button>
            <button onclick="setF('會勘')" id="f-會勘" class="badge bg flex-shrink-0 cursor-pointer py-1.5 px-3">會勘</button>
            <button onclick="setF('設計')" id="f-設計" class="badge bg flex-shrink-0 cursor-pointer py-1.5 px-3">設計</button>
            <button onclick="setF('報價階段')" id="f-報價階段" class="badge bg flex-shrink-0 cursor-pointer py-1.5 px-3">報價</button>
            <button onclick="setF('進行中')" id="f-進行中" class="badge bg flex-shrink-0 cursor-pointer py-1.5 px-3">進行中</button>
            <button onclick="setF('暫停')" id="f-暫停" class="badge bg flex-shrink-0 cursor-pointer py-1.5 px-3">暫停</button>
            <button onclick="setF('驗收')" id="f-驗收" class="badge bg flex-shrink-0 cursor-pointer py-1.5 px-3">驗收</button>
            <button onclick="setF('已完工')" id="f-已完工" class="badge bg flex-shrink-0 cursor-pointer py-1.5 px-3">完工</button>
            <button onclick="setF('保固期')" id="f-保固期" class="badge bg flex-shrink-0 cursor-pointer py-1.5 px-3">保固</button>
        </div>
        <div id="plist"><div class="flex justify-center py-10"><div class="spinner"></div></div></div>
    </div>

    <div id="page-detail" class="hidden p-4">
        <button onclick="backToList()" class="flex items-center gap-1.5 text-gray-400 text-sm font-bold mb-4">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg> 返回
        </button>
        <div id="dcontent"></div>
    </div>

    <div id="page-worker" class="hidden p-4">
        <h2 class="text-base font-black mb-4">我的任務</h2>
        <div id="wlist"><div class="flex justify-center py-10"><div class="spinner"></div></div></div>
    </div>

    <div id="page-client" class="hidden p-4">
        <h2 class="text-base font-black mb-4">我的案場</h2>
        <div id="clist"><div class="flex justify-center py-10"><div class="spinner"></div></div></div>
    </div>

    <div id="page-admin" class="hidden p-4">
        <h2 class="text-base font-black mb-4">系統管理</h2>
        <div class="card mb-4">
            <h3 class="font-black text-sm mb-4">＋ 新增帳號</h3>
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div><label class="label">姓名</label><input id="nu-n" class="inp" placeholder="姓名"></div>
                <div><label class="label">密碼</label><input id="nu-p" class="inp" placeholder="密碼"></div>
            </div>
            <div class="mb-3"><label class="label">角色</label>
                <select id="nu-r" class="inp" onchange="toggleWF()">
                    <option value="manager">專案負責人</option><option value="worker">工班</option><option value="client">業主</option><option value="admin">管理員</option>
                </select>
            </div>
            <div id="wf" class="hidden space-y-3 mb-3">
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="label">公司名稱</label><input id="nu-c" class="inp" placeholder="公司名稱"></div>
                    <div><label class="label">聯絡電話</label><input id="nu-ph" class="inp" placeholder="電話"></div>
                </div>
                <div><label class="label">工班類型</label>
                    <select id="nu-wt" class="inp"><option>泥作</option><option>木工</option><option>水電</option><option>油漆</option><option>鐵工</option><option>拆除</option><option>空調</option><option>其他</option></select>
                </div>
            </div>
            <button onclick="addUser()" class="btn btn-p">新增帳號</button>
        </div>
        <div class="text-xs font-black text-gray-400 uppercase mb-2 tracking-wide">帳號列表</div>
        <div id="ulist" class="space-y-2 mb-6"></div>
        <div class="card mt-4"><h3 class="font-black text-sm mb-3">💰 財務總覽</h3><div id="afin"></div></div>
    </div>
</main>

<nav id="bnav" class="nav-bar fixed bottom-0 w-full flex z-50"></nav>

<script>
const PU='https://jikwrufwagfjdfzhomle.supabase.co';
const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imppa3dydWZ3YWdmamRmemhvbWxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0Nzg5MzYsImV4cCI6MjA5MzA1NDkzNn0.bDXPFk0nB80JLKfZ9yWiCHLV6JhCC8lJhEpfPyjT0ag';
const H={'apikey':AK,'Authorization':`Bearer ${AK}`,'Content-Type':'application/json','Prefer':'return=representation'};
const api=t=>`${PU}/rest/v1/${t}`;
const ST=`${PU}/storage/v1/object/site_photos`;
let CU=null,filt='all',lbI=[],lbX=0;
let D={p:[],u:[],s:[],r:[],n:[],ex:[],xt:[],sv:[],de:[],ins:[]};

const GET=async(t,q='')=>{try{const r=await fetch(`${api(t)}?${q}&limit=500`,{headers:H});return r.ok?await r.json():[];}catch{return[];}};
const POST=async(t,d)=>{try{const r=await fetch(api(t),{method:'POST',headers:H,body:JSON.stringify(d)});if(!r.ok)return null;const x=await r.json();return Array.isArray(x)?x[0]:x;}catch{return null;}};
const PATCH=async(t,id,d)=>{try{const r=await fetch(`${api(t)}?id=eq.${id}`,{method:'PATCH',headers:H,body:JSON.stringify(d)});return r.ok;}catch{return false;}};
const DEL=async(t,id)=>{try{await fetch(`${api(t)}?id=eq.${id}`,{method:'DELETE',headers:H});return true;}catch{return false;}};
const UP=async f=>{const n=`img_${Date.now()}_${Math.random().toString(36).substr(2,5)}.jpg`;try{const r=await fetch(`${ST}/${n}`,{method:'POST',headers:{'apikey':AK,'Authorization':`Bearer ${AK}`,'Content-Type':f.type,'x-upsert':'true'},body:f});return r.ok?`${PU}/storage/v1/object/public/site_photos/${n}`:null;}catch{return null;}};

async function loadAll(){
    const[p,u,s,r,n,ex,xt,sv,de,ins]=await Promise.all([
        GET('projects','order=created_at.desc'),GET('users','order=name.asc'),
        GET('project_stages','order=sort_order.asc'),GET('progress_reports','order=timestamp.desc'),
        GET('site_notifications','order=notify_date.asc'),GET('project_expenses','order=expense_date.desc'),
        GET('project_extras','order=created_at.desc'),GET('site_surveys','order=survey_date.desc'),
        GET('design_records','order=created_at.desc'),GET('inspections','order=inspected_at.desc'),
    ]);
    D={p,u,s,r,n,ex,xt,sv,de,ins};
}

window.onload=async()=>{
    const sid=localStorage.getItem('uid');
    if(sid){await loadAll();const u=D.u.find(x=>x.id==sid);if(u){CU=u;login();return;}}
};
async function doLogin(){
    const id=document.getElementById('li').value.trim(),pw=document.getElementById('lp').value.trim();
    if(!id||!pw)return setMsg('請輸入帳號密碼');
    setMsg('驗證中...');await loadAll();
    const u=D.u.find(x=>x.name===id&&x.password===pw);
    if(!u)return setMsg('帳號或密碼錯誤');
    CU=u;localStorage.setItem('uid',u.id);login();
}
function setMsg(m){document.getElementById('lmsg').innerText=m;}
function login(){
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('urd').innerText=CU.name+' · '+({admin:'管理員',manager:'專案負責人',worker:'工班',client:'業主'}[CU.role]||CU.role);
    buildNav();navTo(CU.role==='worker'?'worker':CU.role==='client'?'client':'projects');
}
function logout(){localStorage.removeItem('uid');location.reload();}

function buildNav(){
    const pages=CU.role==='worker'?[{id:'worker',label:'任務',d:'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2'}]:
    CU.role==='client'?[{id:'client',label:'我的案場',d:'M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z'}]:
    [{id:'projects',label:'案場',d:'M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10'},
    {id:'admin',label:'管理',d:'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z M15 12a3 3 0 11-6 0 3 3 0 016 0z'}];
    document.getElementById('bnav').innerHTML=pages.map(p=>`<button onclick="navTo('${p.id}')" class="nav-btn" id="nb-${p.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${p.d}"/></svg>${p.label}</button>`).join('');
}

function navTo(p){
    ['projects','detail','worker','client','admin'].forEach(v=>{document.getElementById('page-'+v)?.classList.add('hidden');document.getElementById('nb-'+v)?.classList.remove('active');});
    document.getElementById('page-'+p)?.classList.remove('hidden');document.getElementById('nb-'+p)?.classList.add('active');
    if(p==='projects')renderProjects();if(p==='worker')renderWorker();if(p==='client')renderClient();if(p==='admin')renderAdmin();
}

const SB={'會勘':'bpu','設計':'bb','報價階段':'by','進行中':'bk','暫停':'bg','驗收':'by','已完工':'bgn','保固期':'bg'};
const SO=['會勘','設計','報價階段','進行中','暫停','驗收','已完工','保固期'];

function setF(f){
    filt=f;
    document.querySelectorAll('[id^=f-]').forEach(b=>b.className='badge bg flex-shrink-0 cursor-pointer py-1.5 px-3');
    const el=document.getElementById('f-'+f);if(el)el.className='badge bk flex-shrink-0 cursor-pointer py-1.5 px-3';
    renderProjects();
}

function renderProjects(){
    if(CU.role==='admin'||CU.role==='manager')document.getElementById('btn-np').classList.remove('hidden');
    let list=CU.role==='admin'?D.p:D.p.filter(p=>p.manager_id===CU.id);
    if(filt!=='all')list=list.filter(p=>p.status===filt);
    const el=document.getElementById('plist');
    if(!list.length){el.innerHTML=`<div class="text-center py-14 text-gray-400 text-sm">目前沒有案場</div>`;return;}
    el.innerHTML=list.map(p=>{
        const stages=D.s.filter(s=>s.project_id===p.id);
        const done=stages.filter(s=>s.status==='完成').length;
        const pct=stages.length?Math.round(done/stages.length*100):0;
        const fin=calcFin(p.id);
        const mgr=D.u.find(u=>u.id===p.manager_id);
        const tn=D.n.filter(n=>n.project_id===p.id&&n.notify_date===toStr());
        return `<div class="card cursor-pointer" onclick="openProject(${p.id})">
            <div class="flex justify-between items-start mb-2">
                <div class="flex-1 mr-2"><div class="font-black text-black mb-0.5">${p.name}</div><div class="text-xs text-gray-400">${p.address||'未填地址'}${mgr?` · ${mgr.name}`:''}</div></div>
                <span class="badge ${SB[p.status]||'bg'}">${p.status}</span>
            </div>
            ${tn.length?`<div class="bg-amber-50 border border-amber-200 rounded-lg px-3 py-1.5 mb-2 text-xs text-amber-700 font-bold">📅 今日進場：${tn.map(n=>n.worker_name).join('、')}</div>`:''}
            <div class="mb-2"><div class="flex justify-between text-xs text-gray-400 mb-1"><span>進度</span><span>${done}/${stages.length}</span></div><div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div></div>
            ${CU.role!=='client'?`<div class="grid grid-cols-3 gap-1 pt-2 border-t border-gray-100 text-center">
                <div><div class="text-xs text-gray-400">報價</div><div class="mono text-xs font-bold">$${fmt(fin.quote)}</div></div>
                <div><div class="text-xs text-gray-400">成本</div><div class="mono text-xs font-bold">$${fmt(fin.cost)}</div></div>
                <div><div class="text-xs text-gray-400">毛利</div><div class="mono text-xs font-bold ${fin.profit>=0?'text-black':'text-gray-400'}">$${fmt(fin.profit)}</div></div>
            </div>`:''}
        </div>`;
    }).join('');
}

function openProject(id){
    document.getElementById('page-projects').classList.add('hidden');
    document.getElementById('page-detail').classList.remove('hidden');
    document.getElementById('nb-projects')?.classList.remove('active');
    renderDetail(id);
}
function backToList(){
    document.getElementById('page-detail').classList.add('hidden');
    document.getElementById('page-projects').classList.remove('hidden');
    document.getElementById('nb-projects')?.classList.add('active');
    renderProjects();
}

function renderDetail(pid){
    const p=D.p.find(x=>x.id===pid);if(!p)return;
    const canEdit=CU.role==='admin'||CU.id===p.manager_id;
    const isClient=CU.role==='client';
    const stages=D.s.filter(s=>s.project_id===pid).sort((a,b)=>a.sort_order-b.sort_order);
    const surveys=D.sv.filter(s=>s.project_id===pid);
    const designs=D.de.filter(d=>d.project_id===pid);
    const extras=D.xt.filter(e=>e.project_id===pid);
    const expenses=D.ex.filter(e=>e.project_id===pid);
    const notifs=D.n.filter(n=>n.project_id===pid).sort((a,b)=>a.notify_date.localeCompare(b.notify_date));
    const inspList=D.ins.filter(i=>i.project_id===pid);
    const fin=calcFin(pid);
    const mgr=D.u.find(u=>u.id===p.manager_id);

    const STEPS=['會勘','設計','報價','進行中','驗收','完工','保固'];
    const STEP_MAP={'會勘':0,'設計':1,'報價階段':2,'進行中':3,'驗收':4,'已完工':5,'保固期':6,'暫停':3};
    const curIdx=STEP_MAP[p.status]??0;
    const stepsHtml=`<div class="flow-steps">${STEPS.map((s,i)=>{
        const cls=i<curIdx?'done':i===curIdx?'active':'';
        return `<div class="flow-step ${i<curIdx?'done':''}"><div class="sdot ${cls}">${i<curIdx?'✓':i+1}</div><div class="slabel ${cls}">${s}</div></div>`;
    }).join('')}</div>`;

    const stOpts=SO.map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('');

    let html=`<div class="card mb-3">
        <div class="flex justify-between items-start mb-1">
            <div><h2 class="text-lg font-black text-black">${p.name}</h2><div class="text-xs text-gray-400">${p.address||'未填地址'}${mgr?` · 負責：${mgr.name}`:''}</div></div>
            ${canEdit?`<select onchange="updSt(${p.id},this.value)" class="inp" style="width:auto;height:32px;padding:0 28px 0 8px;font-size:12px;">${stOpts}</select>`:`<span class="badge ${SB[p.status]||'bg'}">${p.status}</span>`}
        </div>
        ${stepsHtml}
        ${p.warranty_end_date?`<div class="text-xs text-gray-400 mt-1">🔧 保固到期：${p.warranty_end_date}</div>`:''}
    </div>`;

    // 會勘
    html+=`<details class="card mb-3"${surveys.length?' open':''}>
        <summary class="flex justify-between items-center">
            <span class="font-black text-sm">📷 會勘記錄 <span class="text-gray-400 font-normal text-xs">(${surveys.length})</span></span>
            ${canEdit?`<button onclick="event.preventDefault();openSurvey(${pid})" class="btn btn-p btn-sm">＋ 新增</button>`:''}
        </summary>
        <div class="mt-3 space-y-3">${surveys.map(s=>`<div class="csm">
            <div class="flex justify-between items-start mb-1">
                <div><div class="font-bold text-sm">${s.survey_date}</div>${s.participants?`<div class="text-xs text-gray-400">👥 ${s.participants}</div>`:''}</div>
                ${canEdit?`<button onclick="delR('site_surveys',${s.id},${pid})" class="text-gray-300 hover:text-red-400 text-xl leading-none">×</button>`:''}
            </div>
            ${s.house_condition?`<div class="text-xs text-gray-600 bg-gray-50 rounded p-2 mb-1">${s.house_condition}</div>`:''}
            ${s.notes?`<div class="text-xs text-gray-400">${s.notes}</div>`:''}
            ${ig(s.image_urls)}
        </div>`).join('')}${!surveys.length?`<div class="text-xs text-gray-400 text-center py-2">尚無會勘記錄</div>`:''}
        </div></details>`;

    // 設計
    html+=`<details class="card mb-3"${designs.length?' open':''}>
        <summary class="flex justify-between items-center">
            <span class="font-black text-sm">🎨 設計版本 <span class="text-gray-400 font-normal text-xs">(${designs.length})</span></span>
            ${canEdit?`<button onclick="event.preventDefault();openDesign(${pid})" class="btn btn-p btn-sm">＋ 新增</button>`:''}
        </summary>
        <div class="mt-3 space-y-3">${designs.map(d=>{
            const dsb={'待確認':'by','已確認':'bgn','退回修改':'br'}[d.client_status]||'bg';
            return `<div class="csm">
                <div class="flex justify-between items-start mb-1">
                    <div><span class="font-black text-sm">${d.version}</span><span class="badge ${dsb} ml-1">${d.client_status}</span><div class="text-xs text-gray-400">${d.design_date}</div></div>
                    <div class="flex items-center gap-1">
                        ${canEdit?`<select onchange="updDS(${d.id},this.value,${pid})" class="inp" style="width:auto;height:26px;padding:0 22px 0 6px;font-size:11px;"><option ${d.client_status==='待確認'?'selected':''}>待確認</option><option ${d.client_status==='已確認'?'selected':''}>已確認</option><option ${d.client_status==='退回修改'?'selected':''}>退回修改</option></select>`:''}
                        ${canEdit?`<button onclick="delR('design_records',${d.id},${pid})" class="text-gray-300 hover:text-red-400 text-xl leading-none ml-1">×</button>`:''}
                    </div>
                </div>
                ${d.designer_notes?`<div class="text-xs text-gray-500 bg-gray-50 rounded p-2 mb-1">${d.designer_notes}</div>`:''}
                ${ig(d.image_urls)}
            </div>`;
        }).join('')}${!designs.length?`<div class="text-xs text-gray-400 text-center py-2">尚無設計版本</div>`:''}
        </div></details>`;

    // 財務
    if(!isClient){
        const pr=fin.revenue>0?Math.round(fin.profit/fin.revenue*100):0;
        html+=`<details class="card mb-3">
            <summary class="flex justify-between items-center">
                <span class="font-black text-sm">💰 財務摘要</span>
                <span class="mono font-black text-base ${fin.profit>=0?'text-black':'text-gray-400'}">$${fin.profit.toLocaleString()}</span>
            </summary>
            <div class="mt-3">
                <div class="fin-row"><span class="text-sm text-gray-500">報價總額</span><span class="mono font-bold">$${fin.quote.toLocaleString()}</span></div>
                <div class="fin-row"><span class="text-sm text-gray-500">追加金額</span><span class="mono font-bold text-blue-600">+$${fin.extra.toLocaleString()}</span></div>
                <div class="fin-row"><span class="text-sm font-bold">業主實收</span><span class="mono font-black">$${fin.revenue.toLocaleString()}</span></div>
                <div class="fin-row"><span class="text-sm text-gray-500">發包總額</span><span class="mono text-red-500">-$${fin.contract.toLocaleString()}</span></div>
                <div class="fin-row"><span class="text-sm text-gray-500">材料費</span><span class="mono text-red-500">-$${fin.material.toLocaleString()}</span></div>
                <div class="fin-row"><span class="text-sm text-gray-500">設備租借</span><span class="mono text-red-500">-$${fin.equipment.toLocaleString()}</span></div>
                <div class="fin-row"><span class="text-sm text-gray-500">雜支</span><span class="mono text-red-500">-$${(fin.misc+fin.expCost).toLocaleString()}</span></div>
                <div class="fin-total"><span class="font-black">毛利 (${pr}%)</span><span class="mono font-black text-lg ${fin.profit>=0?'':'text-gray-400'}">$${fin.profit.toLocaleString()}</span></div>
                ${canEdit?`<div class="flex gap-2 mt-3"><button onclick="openExp(${pid})" class="btn btn-s btn-sm flex-1">＋ 雜支</button><button onclick="openExtra(${pid})" class="btn btn-s btn-sm flex-1">＋ 追加</button></div>`:''}
                ${extras.length?`<div class="mt-2 space-y-1">${extras.map(e=>`<div class="flex justify-between text-xs bg-blue-50 rounded px-2 py-1"><span class="text-gray-500">${e.extra_date} ${e.description}</span><span class="mono text-blue-600">+$${e.amount.toLocaleString()}</span></div>`).join('')}</div>`:''}
                ${expenses.length?`<div class="mt-1 space-y-1">${expenses.map(e=>`<div class="flex justify-between text-xs bg-red-50 rounded px-2 py-1"><span class="text-gray-500">${e.expense_date} ${e.description}</span><span class="mono text-red-500">-$${e.amount.toLocaleString()}</span></div>`).join('')}</div>`:''}
            </div>
        </details>`;

        // 報價單
        html+=`<details class="card mb-3">
            <summary class="flex justify-between items-center">
                <span class="font-black text-sm">📋 報價單</span>
                <span class="mono text-sm font-bold">$${fin.quote.toLocaleString()}</span>
            </summary>
            <div class="mt-3">
                ${stages.length?stages.map(s=>`<div class="fin-row"><span class="text-sm">${s.name}</span><div class="text-right"><div class="mono text-sm font-bold">$${(s.quote_amount||0).toLocaleString()}</div>${s.contract_amount?`<div class="mono text-xs text-gray-400">發包 $${s.contract_amount.toLocaleString()}</div>`:''}</div></div>`).join(''):`<div class="text-xs text-gray-400 text-center py-2">請先新增施工階段</div>`}
                <div class="fin-total"><span class="text-sm font-bold">合計</span><span class="mono font-black">$${fin.quote.toLocaleString()}</span></div>
            </div>
        </details>`;
    }

    // 進場通報
    if(!isClient&&canEdit){
        html+=`<details class="card mb-3">
            <summary class="flex justify-between items-center">
                <span class="font-black text-sm">📅 進場通報</span>
                <button onclick="event.preventDefault();openNotify(${pid})" class="btn btn-sm" style="background:#fef9c3;color:#854d0e;border:1px solid #fde68a;">＋ 發通報</button>
            </summary>
            <div class="mt-2">${notifs.length?notifs.map(n=>`<div class="flex items-center gap-2 py-2 border-b border-gray-100 last:border-0">
                <div class="text-xs font-bold w-20 flex-shrink-0 ${n.notify_date===toStr()?'text-amber-600':n.notify_date<toStr()?'text-gray-300':'text-gray-500'}">${n.notify_date}</div>
                <div class="flex-1 text-sm font-bold">${n.worker_name}${n.message?`<span class="text-xs text-gray-400 font-normal ml-1">${n.message}</span>`:''}</div>
                ${canEdit?`<button onclick="delR('site_notifications',${n.id},${pid})" class="text-gray-300 hover:text-red-400 text-xl">×</button>`:''}
            </div>`).join(''):`<div class="text-xs text-gray-400 text-center py-2">尚無通報</div>`}
            </div>
        </details>`;
    }

    // 施工階段
    html+=`<div class="mb-3">
        <div class="flex justify-between items-center mb-2">
            <span class="font-black text-sm">🔨 施工階段</span>
            ${canEdit?`<button onclick="openStage(${pid})" class="btn btn-p btn-sm">＋ 新增</button>`:''}
        </div>
        ${stages.length?stages.map(s=>stageCard(s,canEdit,isClient)).join(''):`<div class="text-xs text-gray-400 text-center py-6">尚未新增施工階段</div>`}
    </div>`;

    // 驗收區塊已整合到上方兩階段驗收

    // 驗收（兩階段）
    const mgrInsp=inspList.filter(i=>i.inspector_role==='manager'||!i.inspector_role);
    const clientInsp=inspList.filter(i=>i.inspector_role==='client');
    const mgrPassed=mgrInsp.some(i=>i.status==='驗收通過');

    html+=`<details class="card mb-3"${inspList.length?' open':''}>
        <summary class="flex justify-between items-center">
            <span class="font-black text-sm">✅ 驗收記錄</span>
            ${canEdit?`<button onclick="event.preventDefault();openInsp(${pid})" class="btn btn-p btn-sm">＋ 新增</button>`:''}
        </summary>
        <div class="mt-3">
            <div class="text-xs font-black text-gray-400 uppercase mb-2">第一階段：設計師／統包驗收</div>
            <div class="space-y-2 mb-3">${mgrInsp.map(i=>{
                const isb={'待驗收':'by','驗收中':'bb','驗收通過':'bgn','驗收退件':'br'}[i.status]||'bg';
                return `<div class="csm"><div class="flex justify-between items-start">
                    <div><span class="badge ${isb}">${i.status}</span><div class="text-xs text-gray-400 mt-0.5">${i.inspected_by||''} · ${new Date(i.inspected_at).toLocaleDateString('zh-TW')}</div></div>
                    ${canEdit?`<button onclick="delR('inspections',${i.id},${pid})" class="text-gray-300 hover:text-red-400 text-xl">×</button>`:''}
                </div>${i.notes?`<div class="text-xs text-gray-500 mt-1">${i.notes}</div>`:''}${ig(i.image_urls)}</div>`;
            }).join('')}${!mgrInsp.length?`<div class="text-xs text-gray-400 text-center py-1">尚無記錄</div>`:''}
            </div>
            <div class="text-xs font-black text-gray-400 uppercase mb-2 mt-3 pt-3 border-t border-gray-100">
                第二階段：業主驗收
                ${!mgrPassed?`<span class="badge bg ml-1 normal-case font-normal">等待第一階段通過</span>`:''}
            </div>
            <div class="space-y-2">${clientInsp.map(i=>{
                const isb={'待驗收':'by','驗收中':'bb','驗收通過':'bgn','驗收退件':'br'}[i.status]||'bg';
                return `<div class="csm"><div class="flex justify-between items-start">
                    <div><span class="badge ${isb}">${i.status}</span><div class="text-xs text-gray-400 mt-0.5">${i.inspected_by||''} · ${new Date(i.inspected_at).toLocaleDateString('zh-TW')}</div></div>
                    ${canEdit?`<button onclick="delR('inspections',${i.id},${pid})" class="text-gray-300 hover:text-red-400 text-xl">×</button>`:''}
                </div>${i.notes?`<div class="text-xs text-gray-500 mt-1">${i.notes}</div>`:''}${ig(i.image_urls)}</div>`;
            }).join('')}${!clientInsp.length?`<div class="text-xs text-gray-400 text-center py-1">${mgrPassed?'業主尚未驗收':'等待第一階段通過後開放'}</div>`:''}
            </div>
        </div>
    </details>`;

    // 刪除案場（管理員限定）
    if(CU.role==='admin'){
        html+=`<div class="mt-4 pt-4 border-t border-gray-200">
            <button onclick="delProject(${pid})" class="btn btn-d btn-sm w-full">🗑 刪除此案場</button>
        </div>`;
    }

    document.getElementById('dcontent').innerHTML=html;
}

async function delProject(pid){
    if(!confirm('確定刪除此案場？\n所有相關記錄（階段、回報、照片記錄）將一併刪除，此操作無法復原。'))return;
    load(true,'刪除中...');
    await DEL('projects',pid);
    await loadAll();load(false);backToList();
}

function stageCard(s,canEdit,isClient){
    const w=D.u.find(u=>u.id===s.assigned_worker_id);
    const rpts=D.r.filter(r=>r.stage_id===s.id);
    const ssb={'待開始':'bg','進行中':'bk','待確認':'by','完成':'bgn'}[s.status]||'bg';
    return `<div class="csm mb-2 ${s.status==='進行中'?'border-black':''}">
        <div class="flex justify-between items-start mb-1">
            <div class="flex-1 mr-2">
                <div class="font-bold text-sm">${s.name}</div>
                ${w?`<div class="text-xs text-gray-400">${w.company_name||w.name}${w.worker_type?` · ${w.worker_type}`:''}</div>`:''}
                ${s.scheduled_date?`<div class="text-xs text-gray-400">📅 ${s.scheduled_date}</div>`:''}
            </div>
            <div class="flex items-center gap-1.5 flex-shrink-0">
                <span class="badge ${ssb}">${s.status}</span>
                ${canEdit?`<button onclick="openEditStage(${s.id})" class="btn btn-s btn-ic">✏️</button>`:''}
            </div>
        </div>
        ${s.notes?`<div class="text-xs text-gray-500 bg-gray-50 rounded p-2 mb-1">${s.notes}</div>`:''}
        ${!isClient?`<div class="grid grid-cols-2 gap-x-3 mt-1 pt-1 border-t border-gray-100">
            <div class="text-xs text-gray-400">報價 <span class="mono font-bold text-black">$${(s.quote_amount||0).toLocaleString()}</span></div>
            <div class="text-xs text-gray-400">發包 <span class="mono font-bold text-black">$${(s.contract_amount||0).toLocaleString()}</span></div>
        </div>`:''}
        ${rpts.length?`<details class="mt-2"><summary class="text-xs text-gray-400 font-bold cursor-pointer">回報記錄 (${rpts.length})</summary>
            <div class="mt-1 space-y-1">${rpts.map(r=>`<div class="bg-gray-50 rounded p-2">
                <div class="flex justify-between text-xs text-gray-400 mb-0.5"><span class="font-bold text-gray-600">${r.worker_name}</span><span>${new Date(r.timestamp).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div>
                ${r.notes?`<div class="text-xs">${r.notes}</div>`:''}${ig(r.image_urls)}
            </div>`).join('')}
            </div></details>`:''}
    </div>`;
}

function renderWorker(){
    const ms=D.s.filter(s=>s.assigned_worker_id===CU.id);
    const el=document.getElementById('wlist');
    if(!ms.length){el.innerHTML=`<div class="text-center py-14 text-gray-400 text-sm">目前沒有指派任務</div>`;return;}
    const active=ms.filter(s=>s.status!=='完成'),done=ms.filter(s=>s.status==='完成');
    el.innerHTML=(active.length?`<div class="text-xs font-black text-gray-400 uppercase mb-2">進行中</div>`+active.map(s=>wTask(s)).join(''):'')+
        (done.length?`<div class="text-xs font-black text-gray-400 uppercase mt-4 mb-2">已完成</div>`+done.map(s=>wTask(s)).join(''):'' );
}
function wTask(s){
    const p=D.p.find(x=>x.id===s.project_id);
    const rpts=D.r.filter(r=>r.stage_id===s.id);
    const ssb={'待開始':'bg','進行中':'bk','待確認':'by','完成':'bgn'}[s.status]||'bg';
    return `<div class="card mb-2">
        <div class="text-xs text-gray-400 font-bold mb-0.5">${p?p.name:'未知案場'}</div>
        <div class="flex justify-between items-start"><div><div class="font-black">${s.name}</div>${s.scheduled_date?`<div class="text-xs text-gray-400">📅 ${s.scheduled_date}</div>`:''}</div><span class="badge ${ssb}">${s.status}</span></div>
        ${s.notes?`<div class="text-xs text-gray-500 bg-gray-50 rounded p-2 mt-1">${s.notes}</div>`:''}
        ${s.status!=='完成'?`<button onclick="openReport(${s.id},'${s.name.replace(/'/g,"\\'")}',${s.project_id})" class="btn btn-p btn-sm mt-2">📤 回報進度</button>`:''}
        ${rpts.length?`<div class="text-xs text-gray-400 mt-1">已回報 ${rpts.length} 次</div>`:''}
    </div>`;
}

function renderClient(){
    const mp=D.p.filter(p=>p.client_id===CU.id);
    const el=document.getElementById('clist');

                        ${ig(d.image_urls)}

function calcFin(pid){
    const s=D.s.filter(x=>x.project_id===pid);
    const xt=D.xt.filter(x=>x.project_id===pid);
    const ep=D.ex.filter(x=>x.project_id===pid);
    const quote=s.reduce((a,x)=>a+(x.quote_amount||0),0);
    const extra=xt.reduce((a,x)=>a+x.amount,0);
    const revenue=quote+extra;
    const contract=s.reduce((a,x)=>a+(x.contract_amount||0),0);
    const material=s.reduce((a,x)=>a+(x.material_cost||0),0);
    const equipment=s.reduce((a,x)=>a+(x.equipment_cost||0),0);
    const misc=s.reduce((a,x)=>a+(x.misc_cost||0),0);
    const expCost=ep.reduce((a,x)=>a+x.amount,0);
    const cost=contract+material+equipment+misc+expCost;
    return{quote,extra,revenue,contract,material,equipment,misc,expCost,cost,profit:revenue-cost};
}

function openLb(u,i=0){lbI=typeof u==='string'?JSON.parse(u.replace(/&quot;/g,'"')):u;lbX=i;updLb();document.getElementById('lightbox').classList.remove('hidden');}
function closeLb(){document.getElementById('lightbox').classList.add('hidden');}
function updLb(){document.getElementById('lb-img').src=lbI[lbX];document.getElementById('lb-prev').classList.toggle('hidden',lbI.length<=1);document.getElementById('lb-next').classList.toggle('hidden',lbI.length<=1);}
function changeLb(d){lbX=(lbX+d+lbI.length)%lbI.length;updLb();}
async function dlLb(){try{const r=await fetch(lbI[lbX]);saveAs(await r.blob(),`照片_${lbX+1}.jpg`);}catch{window.open(lbI[lbX],'_blank');}}

function load(show,text='處理中...'){document.getElementById('lov').classList.toggle('hidden',!show);document.getElementById('ltxt').innerText=text;}
function toStr(){return new Date().toISOString().split('T')[0];}
function fmt(n){if(!n&&n!==0)return'0';return Math.abs(n)>=10000?(n/10000).toFixed(1)+'萬':Math.abs(n).toLocaleString();}

function ig(urls){
    if(!urls)return'';
    const arr=Array.isArray(urls)?urls:(typeof urls==='string'&&urls.startsWith('['))?JSON.parse(urls):[];
    if(!arr.length)return'';
    const safe=JSON.stringify(arr).replace(/"/g,'&quot;');
    return `<div class="img-grid">${arr.map((u,i)=>`<img src="${u}" onclick="openLb('${safe}',${i})" loading="lazy">`).join('')}</div>`;
}
function prevF(input,pvId,phId){
    const pv=document.getElementById(pvId),ph=document.getElementById(phId);
    pv.innerHTML='';
    if(input.files.length){ph.classList.add('hidden');pv.classList.remove('hidden');
        Array.from(input.files).forEach(f=>{const r=new FileReader();r.onload=e=>{const img=document.createElement('img');img.src=e.target.result;img.className='w-full h-20 object-cover rounded-lg';pv.appendChild(img);};r.readAsDataURL(f);});}
}
async function upFiles(inputId){
    const files=document.getElementById(inputId)?.files||[];
    const urls=[];for(const f of files){const u=await UP(f);if(u)urls.push(u);}return urls;
}
