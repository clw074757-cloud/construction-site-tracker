<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>案場追蹤系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans TC',sans-serif;background:#f4f4f4;color:#111;font-size:15px;min-height:100vh;}
.hidden{display:none!important;}
.inp{width:100%;height:48px;padding:0 14px;background:#f8f8f8;border:1.5px solid #e0e0e0;border-radius:10px;font-size:15px;font-family:'Noto Sans TC',sans-serif;color:#111;outline:none;transition:border-color 0.2s;-webkit-appearance:none;}
.inp:focus{border-color:#111;background:#fff;}
.inp::placeholder{color:#bbb;}
textarea.inp{height:auto;padding:12px 14px;resize:none;}
select.inp{background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23111' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 12px center;background-size:18px;padding-right:36px;background-color:#f8f8f8;}
.label{display:block;font-size:11px;font-weight:700;color:#888;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.06em;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 20px;border-radius:10px;font-weight:700;font-size:15px;font-family:'Noto Sans TC',sans-serif;border:none;cursor:pointer;transition:all 0.15s;}
.btn:active{transform:scale(0.97);}
.btn-p{background:#111;color:#fff;}
.btn-s{background:#fff;color:#111;border:1.5px solid #ddd;}
.btn-d{background:#fee2e2;color:#dc2626;border:1.5px solid #fca5a5;}
.btn-sm{padding:7px 14px;font-size:13px;width:auto;border-radius:8px;}
.btn-ic{width:34px;height:34px;padding:0;border-radius:8px;flex-shrink:0;}
.card{background:#fff;border:1.5px solid #e8e8e8;border-radius:16px;padding:18px;margin-bottom:12px;}
.csm{background:#f8f8f8;border:1.5px solid #e8e8e8;border-radius:12px;padding:14px;margin-bottom:8px;}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.bk{background:#111;color:#fff;}
.bg{background:#f0f0f0;color:#555;border:1px solid #e0e0e0;}
.bgn{background:#dcfce7;color:#166534;border:1px solid #bbf7d0;}
.by{background:#fef9c3;color:#854d0e;border:1px solid #fde68a;}
.prog-bar{height:5px;background:#eee;border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;background:#111;border-radius:99px;transition:width 0.4s;}
.nav-bar{background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);border-top:1.5px solid #e8e8e8;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:9px 4px 11px;color:#ccc;font-size:10px;font-weight:700;font-family:'Noto Sans TC',sans-serif;background:none;border:none;cursor:pointer;gap:3px;transition:color 0.2s;}
.nav-btn.active{color:#111;}
.nav-btn svg{width:20px;height:20px;}
.modal-bg{background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);}
.modal-box{background:#fff;border:1.5px solid #e0e0e0;border-radius:20px;max-height:88vh;overflow-y:auto;box-shadow:0 8px 40px rgba(0,0,0,0.12);}
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px;}
.img-grid img{width:100%;height:90px;object-fit:cover;border-radius:7px;border:1px solid #e8e8e8;cursor:pointer;}
.spinner{border:3px solid #eee;border-top:3px solid #111;border-radius:50%;width:32px;height:32px;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#lightbox{background:rgba(0,0,0,0.93);}
details>summary{list-style:none;cursor:pointer;}
details>summary::-webkit-details-marker{display:none;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:#ddd;border-radius:99px;}
</style>
</head>
<body>

<div id="login-screen" class="fixed inset-0 z-[100] flex items-center justify-center p-5 bg-gray-100">
  <div class="bg-white w-full max-w-sm p-8 rounded-3xl shadow-lg border border-gray-200">
    <div class="text-center mb-8">
      <div class="w-12 h-12 bg-black rounded-2xl flex items-center justify-center mx-auto mb-4">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
      </div>
      <h1 class="text-2xl font-black">案場追蹤系統</h1>
      <p class="text-sm text-gray-400 mt-1">工程進度管理平台</p>
    </div>
    <div class="space-y-3">
      <div><label class="label">帳號</label><input id="li" class="inp" placeholder="帳號"></div>
      <div><label class="label">密碼</label><input id="lp" type="password" class="inp" placeholder="密碼" onkeydown="if(event.key==='Enter')doLogin()"></div>
    </div>
    <button onclick="doLogin()" class="btn btn-p mt-5">登入</button>
    <p id="lmsg" class="text-center text-red-400 text-sm mt-3 min-h-[20px]"></p>
  </div>
</div>

<div id="lov" class="fixed inset-0 bg-black/60 z-[200] hidden flex items-center justify-center flex-col gap-3">
  <div class="spinner" style="border-top-color:#fff"></div>
  <div id="ltxt" class="text-white font-bold text-sm">處理中...</div>
</div>

<div id="lightbox" class="fixed inset-0 z-[300] hidden flex items-center justify-center" style="background:rgba(0,0,0,0.93)">
  <button onclick="closeLb()" class="absolute top-4 right-4 text-white w-10 h-10 flex items-center justify-center bg-white/10 rounded-full text-2xl">x</button>
  <button id="lb-prev" onclick="changeLb(-1)" class="absolute left-2 text-white text-4xl w-12 h-20 flex items-center justify-center bg-white/10 rounded-xl hidden">&#8249;</button>
  <button id="lb-next" onclick="changeLb(1)" class="absolute right-2 text-white text-4xl w-12 h-20 flex items-center justify-center bg-white/10 rounded-xl hidden">&#8250;</button>
  <button onclick="dlLb()" class="absolute bottom-5 right-5 text-white w-12 h-12 flex items-center justify-center bg-white/10 rounded-full text-xl border border-white/20">&#11015;</button>
  <img id="lb-img" class="max-h-[90vh] max-w-[92vw] object-contain select-none rounded-lg" src="">
</div>

<div id="modal" class="fixed inset-0 modal-bg z-[80] hidden flex items-end sm:items-center justify-center p-4">
  <div class="modal-box w-full max-w-md p-6"><div id="mc"></div></div>
</div>

<header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-gray-200 px-4 py-3 flex justify-between items-center">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 bg-black rounded-lg flex items-center justify-center flex-shrink-0">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
    </div>
    <div>
      <div class="font-black text-sm leading-tight">案場追蹤系統</div>
      <div id="urd" class="text-xs text-gray-400">未登入</div>
    </div>
  </div>
  <button onclick="logout()" class="text-xs font-bold text-gray-500 bg-gray-100 px-3 py-1.5 rounded-lg border border-gray-200">登出</button>
</header>

<main class="pb-28">
  <div id="page-projects" class="hidden p-4">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-base font-black">案場列表</h2>
      <button id="btn-np" onclick="openNewProject()" class="btn btn-p btn-sm hidden">+ 新增案場</button>
    </div>
    <div class="flex gap-2 overflow-x-auto pb-2 mb-3" style="scrollbar-width:none;">
      <button onclick="setF('all')" id="f-all" class="badge bk flex-shrink-0 cursor-pointer py-1.5 px-3">全部</button>
      <button onclick="setF('進行中')" id="f-進行中" class="badge bg flex-shrink-0 cursor-pointer py-1.5 px-3">進行中</button>
      <button onclick="setF('暫停')" id="f-暫停" class="badge bg flex-shrink-0 cursor-pointer py-1.5 px-3">暫停</button>
      <button onclick="setF('已完工')" id="f-已完工" class="badge bg flex-shrink-0 cursor-pointer py-1.5 px-3">完工</button>
    </div>
    <div id="plist"><div class="flex justify-center py-10"><div class="spinner"></div></div></div>
  </div>

  <div id="page-detail" class="hidden p-4">
    <button onclick="backToList()" class="flex items-center gap-1.5 text-gray-400 text-sm font-bold mb-4">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>返回
    </button>
    <div id="dcontent"></div>
  </div>

  <div id="page-worker" class="hidden p-4">
    <h2 class="text-base font-black mb-4">我的任務</h2>
    <div id="wlist"><div class="flex justify-center py-10"><div class="spinner"></div></div></div>
  </div>

  <div id="page-admin" class="hidden p-4">
    <h2 class="text-base font-black mb-4">帳號管理</h2>
    <div class="card mb-4">
      <h3 class="font-black text-sm mb-4">+ 新增帳號</h3>
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div><label class="label">姓名</label><input id="nu-n" class="inp" placeholder="姓名"></div>
        <div><label class="label">密碼</label><input id="nu-p" class="inp" placeholder="密碼"></div>
      </div>
      <div class="mb-3"><label class="label">角色</label>
        <select id="nu-r" class="inp" onchange="toggleWF()">
          <option value="manager">設計師/負責人</option>
          <option value="worker">工班</option>
          <option value="admin">管理員</option>
        </select>
      </div>
      <div id="wf" class="hidden space-y-3 mb-3">
        <div class="grid grid-cols-2 gap-3">
          <div><label class="label">公司名稱</label><input id="nu-c" class="inp" placeholder="公司名稱"></div>
          <div><label class="label">聯絡電話</label><input id="nu-ph" class="inp" placeholder="電話"></div>
        </div>
        <div><label class="label">工班類型</label>
          <select id="nu-wt" class="inp">
            <option>泥作</option><option>木工</option><option>水電</option><option>油漆</option><option>鐵工</option><option>拆除</option><option>空調</option><option>其他</option>
          </select>
        </div>
      </div>
      <button onclick="addUser()" class="btn btn-p">新增帳號</button>
    </div>
    <div class="text-xs font-black text-gray-400 uppercase mb-2 tracking-wide">帳號列表</div>
    <div id="ulist" class="space-y-2"></div>
  </div>
</main>

<nav id="bnav" class="nav-bar fixed bottom-0 w-full flex z-50"></nav>

<script>
const PU='https://jikwrufwagfjdfzhomle.supabase.co';
const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imppa3dydWZ3YWdmamRmemhvbWxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0Nzg5MzYsImV4cCI6MjA5MzA1NDkzNn0.bDXPFk0nB80JLKfZ9yWiCHLV6JhCC8lJhEpfPyjT0ag';
const H={'apikey':AK,'Authorization':'Bearer '+AK,'Content-Type':'application/json','Prefer':'return=representation'};
const api=t=>PU+'/rest/v1/'+t;
const ST=PU+'/storage/v1/object/site_photos';
let CU=null,filt='all',lbI=[],lbX=0;
let D={projects:[],users:[],stages:[],reports:[],notifs:[]};

const GET=async(t,q)=>{try{const r=await fetch(api(t)+'?'+(q||'')+'&limit=500',{headers:H});return r.ok?await r.json():[];}catch{return[];}};
const POST=async(t,d)=>{try{const r=await fetch(api(t),{method:'POST',headers:H,body:JSON.stringify(d)});if(!r.ok)return null;const x=await r.json();return Array.isArray(x)?x[0]:x;}catch{return null;}};
const PATCH=async(t,id,d)=>{try{const r=await fetch(api(t)+'?id=eq.'+id,{method:'PATCH',headers:H,body:JSON.stringify(d)});return r.ok;}catch{return false;}};
const DEL=async(t,id)=>{try{await fetch(api(t)+'?id=eq.'+id,{method:'DELETE',headers:H});return true;}catch{return false;}};
const UP=async f=>{
  const n='img_'+Date.now()+'_'+Math.random().toString(36).substr(2,5)+'.jpg';
  try{const r=await fetch(ST+'/'+n,{method:'POST',headers:{'apikey':AK,'Authorization':'Bearer '+AK,'Content-Type':f.type,'x-upsert':'true'},body:f});
  return r.ok?PU+'/storage/v1/object/public/site_photos/'+n:null;}catch{return null;}
};

async function loadAll(){
  const[p,u,s,r,n]=await Promise.all([
    GET('projects','order=created_at.desc'),
    GET('users','order=name.asc'),
    GET('project_stages','order=sort_order.asc'),
    GET('progress_reports','order=timestamp.desc'),
    GET('site_notifications','order=notify_date.asc'),
  ]);
  D={projects:p,users:u,stages:s,reports:r,notifs:n};
}

window.onload=async()=>{
  const sid=localStorage.getItem('uid');
  if(sid){await loadAll();const u=D.users.find(x=>x.id==sid);if(u){CU=u;login();return;}}
};

async function doLogin(){
  const id=document.getElementById('li').value.trim(),pw=document.getElementById('lp').value.trim();
  if(!id||!pw)return setMsg('請輸入帳號密碼');
  setMsg('驗證中...');await loadAll();
  const u=D.users.find(x=>x.name===id&&x.password===pw);
  if(!u)return setMsg('帳號或密碼錯誤');
  CU=u;localStorage.setItem('uid',u.id);login();
}
function setMsg(m){document.getElementById('lmsg').innerText=m;}
function login(){
  document.getElementById('login-screen').classList.add('hidden');
  const rl={admin:'管理員',manager:'設計師',worker:'工班'};
  document.getElementById('urd').innerText=CU.name+' · '+(rl[CU.role]||CU.role);
  buildNav();navTo(CU.role==='worker'?'worker':'projects');
}
function logout(){localStorage.removeItem('uid');location.reload();}

function buildNav(){
  const pages=CU.role==='worker'?[
    {id:'worker',label:'任務',d:'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2'}
  ]:[
    {id:'projects',label:'案場',d:'M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z'},
    {id:'admin',label:'帳號',d:'M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75'},
  ];
  document.getElementById('bnav').innerHTML=pages.map(p=>'<button onclick="navTo(\''+p.id+'\')" class="nav-btn" id="nb-'+p.id+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+p.d+'"/></svg>'+p.label+'</button>').join('');
}

function navTo(p){
  ['projects','detail','worker','admin'].forEach(v=>{
    document.getElementById('page-'+v).classList.add('hidden');
    const b=document.getElementById('nb-'+v);if(b)b.classList.remove('active');
  });
  document.getElementById('page-'+p).classList.remove('hidden');
  const b=document.getElementById('nb-'+p);if(b)b.classList.add('active');
  if(p==='projects')renderProjects();
  if(p==='worker')renderWorker();
  if(p==='admin')renderAdmin();
}

function setF(f){
  filt=f;
  document.querySelectorAll('[id^=f-]').forEach(b=>b.className='badge bg flex-shrink-0 cursor-pointer py-1.5 px-3');
  document.getElementById('f-'+f).className='badge bk flex-shrink-0 cursor-pointer py-1.5 px-3';
  renderProjects();
}

const SB={'進行中':'bk','暫停':'by','已完工':'bgn'};

function renderProjects(){
  if(CU.role!=='worker')document.getElementById('btn-np').classList.remove('hidden');
  let list=CU.role==='admin'?D.projects:D.projects.filter(p=>p.manager_id===CU.id);
  if(filt!=='all')list=list.filter(p=>p.status===filt);
  const el=document.getElementById('plist');
  if(!list.length){el.innerHTML='<div class="text-center py-14 text-gray-400 text-sm font-bold">目前沒有案場</div>';return;}
  el.innerHTML=list.map(function(p){
    const stages=D.stages.filter(s=>s.project_id===p.id);
    const done=stages.filter(s=>s.status==='完成').length;
    const pct=stages.length?Math.round(done/stages.length*100):0;
    const mgr=D.users.find(u=>u.id===p.manager_id);
    const tn=D.notifs.filter(n=>n.project_id===p.id&&n.notify_date===toStr());
    const last=D.reports.filter(r=>r.project_id===p.id)[0];
    return '<div class="card cursor-pointer" onclick="openProject('+p.id+')">'+
      '<div class="flex justify-between items-start mb-2">'+
        '<div class="flex-1 mr-3">'+
          '<div class="font-black text-base mb-0.5">'+p.name+'</div>'+
          '<div class="text-xs text-gray-400">'+(p.address||'未填地址')+(mgr&&CU.role==='admin'?' · '+mgr.name:'')+'</div>'+
        '</div>'+
        '<span class="badge '+(SB[p.status]||'bg')+' flex-shrink-0">'+p.status+'</span>'+
      '</div>'+
      (tn.length?'<div class="bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 mb-2 text-xs text-amber-700 font-bold">今日進場：'+tn.map(n=>n.worker_name).join('、')+'</div>':'')+
      '<div class="mb-1"><div class="flex justify-between text-xs text-gray-400 mb-1.5"><span>工種進度</span><span>'+done+'/'+stages.length+'</span></div>'+
      '<div class="prog-bar"><div class="prog-fill" style="width:'+pct+'%"></div></div></div>'+
      (last?'<div class="text-xs text-gray-400 mt-2 pt-2 border-t border-gray-100">最新：'+last.worker_name+' · '+new Date(last.timestamp).toLocaleDateString('zh-TW')+'</div>':'')+
    '</div>';
  }).join('');
}

function openProject(id){
  document.getElementById('page-projects').classList.add('hidden');
  document.getElementById('page-detail').classList.remove('hidden');
  const b=document.getElementById('nb-projects');if(b)b.classList.remove('active');
  renderDetail(id);
}
function backToList(){
  document.getElementById('page-detail').classList.add('hidden');
  document.getElementById('page-projects').classList.remove('hidden');
  const b=document.getElementById('nb-projects');if(b)b.classList.add('active');
  renderProjects();
}

function renderDetail(pid){
  const p=D.projects.find(x=>x.id===pid);if(!p)return;
  const canEdit=CU.role==='admin'||CU.id===p.manager_id;
  const stages=D.stages.filter(s=>s.project_id===pid).sort((a,b)=>a.sort_order-b.sort_order);
  const notifs=D.notifs.filter(n=>n.project_id===pid).sort((a,b)=>b.notify_date.localeCompare(a.notify_date));
  const mgr=D.users.find(u=>u.id===p.manager_id);
  const stOpts=['進行中','暫停','已完工'].map(s=>'<option '+(p.status===s?'selected':'')+'>'+s+'</option>').join('');

  let html='<div class="card mb-3">'+
    '<div class="flex justify-between items-start">'+
      '<div><h2 class="text-xl font-black">'+p.name+'</h2>'+
      '<div class="text-xs text-gray-400 mt-0.5">'+(p.address||'未填地址')+(mgr?' · '+mgr.name:'')+'</div></div>'+
      (canEdit?'<select onchange="updStatus('+p.id+',this.value)" class="inp" style="width:auto;height:34px;padding:0 28px 0 10px;font-size:13px;">'+stOpts+'</select>':
      '<span class="badge '+(SB[p.status]||'bg')+'">'+p.status+'</span>')+
    '</div>'+
    (p.notes?'<div class="text-sm text-gray-500 mt-2 bg-gray-50 rounded p-2">'+p.notes+'</div>':'')+
  '</div>';

  if(canEdit){
    html+='<div class="card mb-3">'+
      '<div class="flex justify-between items-center mb-3">'+
        '<span class="font-black text-sm">進場通報</span>'+
        '<button onclick="openNotify('+pid+')" class="btn btn-sm" style="background:#fef9c3;color:#854d0e;border:1px solid #fde68a;font-weight:700;">+ 發通報</button>'+
      '</div>'+
      (notifs.length?
        '<div class="space-y-1">'+notifs.slice(0,8).map(function(n){
          const isT=n.notify_date===toStr(),isP=n.notify_date<toStr();
          return '<div class="flex items-center gap-3 py-2 border-b border-gray-100 last:border-0">'+
            '<div class="w-2 h-2 rounded-full flex-shrink-0 '+(isT?'bg-amber-400':isP?'bg-gray-200':'bg-blue-400')+'"></div>'+
            '<div class="text-xs font-bold flex-shrink-0 w-16 '+(isT?'text-amber-600':isP?'text-gray-300':'text-gray-500')+'">'+n.notify_date+'</div>'+
            '<div class="flex-1 text-sm font-bold '+(isP?'text-gray-400':'')+'">'+n.worker_name+'</div>'+
            (n.message?'<div class="text-xs text-gray-400 truncate max-w-[80px]">'+n.message+'</div>':'')+
            '<button onclick="delNotif('+n.id+','+pid+')" class="text-gray-300 hover:text-red-400 text-lg leading-none flex-shrink-0">x</button>'+
          '</div>';
        }).join('')+'</div>' :
        '<div class="text-xs text-gray-400 text-center py-3">尚無進場通報</div>')+
    '</div>';
  }

  html+='<div class="mb-3">'+
    '<div class="flex justify-between items-center mb-3">'+
      '<span class="font-black text-sm">工種進度</span>'+
      (canEdit?'<button onclick="openAddStage('+pid+')" class="btn btn-p btn-sm">+ 新增工種</button>':'')+
    '</div>'+
    (stages.length?stages.map(s=>renderStage(s,canEdit)).join(''):'<div class="text-xs text-gray-400 text-center py-6 bg-white rounded-xl border border-dashed border-gray-300">尚未新增工種</div>')+
  '</div>';

  const allR=D.reports.filter(r=>r.project_id===pid);
  if(allR.length){
    html+='<details class="card mb-3" open>'+
      '<summary class="flex justify-between items-center font-black text-sm">'+
        '<span>施工回報記錄</span><span class="text-gray-400 font-normal text-xs">'+allR.length+' 筆</span>'+
      '</summary>'+
      '<div class="mt-3 space-y-4">'+allR.map(function(r){
        const stage=D.stages.find(s=>s.id===r.stage_id);
        return '<div class="border-b border-gray-100 pb-3 last:border-0">'+
          (stage?'<div class="text-xs font-bold text-gray-400 mb-0.5">'+stage.name+'</div>':'')+
          '<div class="flex justify-between items-start">'+
            '<div class="font-bold text-sm">'+r.worker_name+'</div>'+
            '<div class="text-xs text-gray-400">'+new Date(r.timestamp).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+'</div>'+
          '</div>'+
          (r.notes?'<div class="text-sm text-gray-600 mt-0.5">'+r.notes+'</div>':'')+
          ig(r.image_urls)+
        '</div>';
      }).join('')+'</div>'+
    '</details>';
  }

  if(CU.role==='admin'){
    html+='<div class="mt-2 mb-4"><button onclick="delProject('+pid+')" class="btn btn-d btn-sm w-full">削除此案場</button></div>';
  }
  document.getElementById('dcontent').innerHTML=html;
}

function renderStage(s,canEdit){
  const w=D.users.find(u=>u.id===s.assigned_worker_id);
  const rpts=D.reports.filter(r=>r.stage_id===s.id);
  const ssb={'待開始':'bg','進行中':'bk','待確認':'by','完成':'bgn'}[s.status]||'bg';
  const last=rpts[0];
  return '<div class="card mb-2 '+(s.status==='進行中'?'border-black':'')+'">'+
    '<div class="flex justify-between items-start">'+
      '<div class="flex-1 mr-3">'+
        '<div class="flex items-center gap-2 mb-1"><span class="font-black text-base">'+s.name+'</span><span class="badge '+ssb+'">'+s.status+'</span></div>'+
        (w?'<div class="text-xs text-gray-500">'+(w.company_name||w.name)+(w.worker_type?' · '+w.worker_type:'')+'</div>':'<div class="text-xs text-gray-400">未指派工班</div>')+
        (s.scheduled_date?'<div class="text-xs text-gray-400 mt-0.5">預計進場：'+s.scheduled_date+'</div>':'')+
      '</div>'+
      (canEdit?'<div class="flex gap-1.5 flex-shrink-0"><button onclick="openEditStage('+s.id+')" class="btn btn-s btn-ic text-sm">✏️</button><button onclick="delStage('+s.id+','+s.project_id+')" class="btn btn-d btn-ic text-sm">x</button></div>':'')+
    '</div>'+
    (s.notes?'<div class="text-xs text-gray-500 bg-gray-50 rounded p-2 mt-2">'+s.notes+'</div>':'')+
    (last?'<div class="mt-2 pt-2 border-t border-gray-100">'+
      '<div class="text-xs text-gray-400 mb-1">最新：'+new Date(last.timestamp).toLocaleDateString('zh-TW')+' · '+last.worker_name+'</div>'+
      (last.notes?'<div class="text-xs text-gray-600">'+last.notes+'</div>':'')+
      ig(last.image_urls)+
    '</div>':'')+
    (rpts.length>1?'<details class="mt-2"><summary class="text-xs text-gray-400 cursor-pointer font-bold">查看全部 '+rpts.length+' 筆回報</summary>'+
      '<div class="mt-2 space-y-2">'+rpts.slice(1).map(function(r){
        return '<div class="bg-gray-50 rounded-lg p-3">'+
          '<div class="flex justify-between text-xs text-gray-400 mb-1"><span class="font-bold text-gray-600">'+r.worker_name+'</span><span>'+new Date(r.timestamp).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+'</span></div>'+
          (r.notes?'<div class="text-xs">'+r.notes+'</div>':'')+ig(r.image_urls)+
        '</div>';
      }).join('')+'</div></details>':'')+
  '</div>';
}

function renderWorker(){
  const ms=D.stages.filter(s=>s.assigned_worker_id===CU.id);
  const el=document.getElementById('wlist');
  if(!ms.length){el.innerHTML='<div class="text-center py-14 text-gray-400 text-sm font-bold">目前沒有指派任務</div>';return;}
  const tn=D.notifs.filter(n=>n.worker_id===CU.id&&n.notify_date===toStr());
  let html='';
  if(tn.length){
    html+='<div class="bg-amber-50 border-2 border-amber-300 rounded-2xl p-4 mb-4">'+
      '<div class="font-black text-amber-800 mb-1">今日進場通知</div>'+
      tn.map(function(n){const p=D.projects.find(x=>x.id===n.project_id);return '<div class="text-sm text-amber-700 font-bold">'+(p?p.name:'')+' '+(n.message?n.message:'')+'</div>';}).join('')+
    '</div>';
  }
  const active=ms.filter(s=>s.status!=='完成');
  const done=ms.filter(s=>s.status==='完成');
  if(active.length){html+='<div class="text-xs font-black text-gray-400 uppercase mb-2 tracking-wide">進行中的任務</div>';html+=active.map(workerCard).join('');}
  if(done.length){html+='<div class="text-xs font-black text-gray-400 uppercase mt-5 mb-2 tracking-wide">已完成</div>';html+=done.map(workerCard).join('');}
  el.innerHTML=html;
}

function workerCard(s){

  const ssb={'待開始':'bg','進行中':'bk','待確認':'by','完成':'bgn'}[s.status]||'bg';
  return '<div class="card mb-3">'+
    '<div class="flex justify-between items-start mb-2">'+
      '<div>'+
        '<div class="text-xs text-gray-400 font-bold mb-0.5">'+(p?p.name:'')+'</div>'+
        '<div class="font-black text-base">'+s.name+'</div>'+
        (p&&p.address?'<div class="text-xs text-gray-400">'+p.address+'</div>':'')+
      '</div>'+
      '<span class="badge '+ssb+' flex-shrink-0">'+s.status+'</span>'+
    '</div>'+
    (s.scheduled_date?'<div class="text-xs text-gray-500 bg-gray-50 rounded p-2 mb-2">預計進場：<strong>'+s.scheduled_date+'</strong></div>':'')+
    (s.notes?'<div class="text-xs text-gray-500 bg-gray-50 rounded p-2 mb-2">'+s.notes+'</div>':'')+

}

async function addUser(){
  const n=document.getElementById('nu-n').value.trim(),pw=document.getElementById('nu-p').value.trim(),role=document.getElementById('nu-r').value;
  if(!n||!pw)return alert('請填姓名與密碼');
  const d={name:n,password:pw,role,phone:document.getElementById('nu-ph').value.trim()||null,company_name:document.getElementById('nu-c').value.trim()||null,worker_type:role==='worker'?document.getElementById('nu-wt').value:null};
  if(await POST('users',d)){alert('新增成功');['nu-n','nu-p','nu-ph','nu-c'].forEach(id=>document.getElementById(id).value='');await loadAll();renderAdmin();}
  else alert('新增失敗');
}
async function saveUser(id){
  const role=document.getElementById('eu-r-'+id).value;
  const d={name:document.getElementById('eu-n-'+id).value.trim(),password:document.getElementById('eu-p-'+id).value.trim(),role};
  const c=document.getElementById('eu-c-'+id);if(c)d.company_name=c.value.trim()||null;
  const ph=document.getElementById('eu-ph-'+id);if(ph)d.phone=ph.value.trim()||null;
  const wt=document.getElementById('eu-wt-'+id);d.worker_type=role==='worker'&&wt?wt.value:null;
  if(!d.name||!d.password)return alert('姓名與密碼不能為空');
  if(await PATCH('users',id,d)){await loadAll();renderAdmin();alert('已儲存');}else alert('儲存失敗');
}
async function delUser(id){if(!confirm('確定刪除此帳號？'))return;await DEL('users',id);await loadAll();renderAdmin();}

async function delProject(pid){
  if(!confirm('確定刪除此案場？所有工種與回報記錄也會一併刪除，無法復原。'))return;
  load(true,'刪除中...');
  const stages=D.stages.filter(s=>s.project_id===pid);
  for(const s of stages){
    const rpts=D.reports.filter(r=>r.stage_id===s.id);
    for(const r of rpts)await DEL('progress_reports',r.id);
    await DEL('project_stages',s.id);
  }
  for(const n of D.notifs.filter(n=>n.project_id===pid))await DEL('site_notifications',n.id);
  await DEL('projects',pid);
  await loadAll();load(false);backToList();
}

        '<div id="r-pv" class="hidden img-grid"></div>'+
      '</div>'+
    '</div>'+
    '<div class="flex gap-3 mt-5"><button onclick="closeM()" class="btn btn-s">取消</button><button onclick="saveReport('+sid+','+pid+')" class="btn btn-p">提交今日回報</button></div>');
}
async function saveReport(sid,pid){
  load(true,'上傳照片中...');
  const urls=await upFiles('r-f');
  const notes=document.getElementById('r-n').value.trim();
  await POST('progress_reports',{stage_id:sid,project_id:pid,worker_id:CU.id,worker_name:CU.name,notes:notes,image_urls:urls,timestamp:new Date().toISOString()});
  const stage=D.stages.find(s=>s.id===sid);
  if(stage&&stage.status==='待開始')await PATCH('project_stages',sid,{status:'進行中'});
  await loadAll();load(false);closeM();renderWorker();
}

function openLb(u,i){
  i=i||0;
  lbI=typeof u==='string'?JSON.parse(u.replace(/&quot;/g,'"')):u;
  lbX=i;updLb();document.getElementById('lightbox').classList.remove('hidden');
}
function closeLb(){document.getElementById('lightbox').classList.add('hidden');}
function updLb(){
  document.getElementById('lb-img').src=lbI[lbX];
  document.getElementById('lb-prev').classList.toggle('hidden',lbI.length<=1);
  document.getElementById('lb-next').classList.toggle('hidden',lbI.length<=1);
}
function changeLb(d){lbX=(lbX+d+lbI.length)%lbI.length;updLb();}
async function dlLb(){try{const r=await fetch(lbI[lbX]);saveAs(await r.blob(),'photo_'+(lbX+1)+'.jpg');}catch{window.open(lbI[lbX],'_blank');}}

function load(show,text){document.getElementById('lov').classList.toggle('hidden',!show);document.getElementById('ltxt').innerText=text||'處理中...';}
function toStr(){return new Date().toISOString().split('T')[0];}

function ig(urls){
  if(!urls)return'';
  let arr=[];
  if(Array.isArray(urls))arr=urls;
  else if(typeof urls==='string'){try{arr=JSON.parse(urls);}catch{arr=urls?[urls]:[]; }}
  else if(typeof urls==='object')arr=Object.values(urls);
  arr=arr.filter(function(u){return u&&typeof u==='string';});
  if(!arr.length)return'';
  const safe=JSON.stringify(arr).replace(/"/g,'&quot;');
  return '<div class="img-grid">'+arr.map(function(u,i){return '<img src="'+u+'" onclick="openLb(\''+safe+'\','+i+')" loading="lazy" onerror="this.style.display=\'none\'">';}).join('')+'</div>';
}

function prevF(input,pvId,phId){
  const pv=document.getElementById(pvId),ph=document.getElementById(phId);
  pv.innerHTML='';
  if(input.files.length){
    ph.classList.add('hidden');pv.classList.remove('hidden');
    Array.from(input.files).forEach(function(f){
      const reader=new FileReader();
      reader.onload=function(e){const img=document.createElement('img');img.src=e.target.result;img.className='w-full h-20 object-cover rounded-lg';pv.appendChild(img);};
      reader.readAsDataURL(f);
    });
  }
}
async function upFiles(inputId){
  const files=document.getElementById(inputId)?document.getElementById(inputId).files:[];
  const urls=[];
  for(let i=0;i<files.length;i++){const u=await UP(files[i]);if(u)urls.push(u);}
  return urls;
}
</script>
